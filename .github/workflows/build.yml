name: Build app and publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  website:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: d
        uses: actions/deploy-pages@v4
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Saeedi-Orders.apk
      - uses: actions/upload-artifact@v4
        with: { name: Saeedi-Orders-APK, path: Saeedi-Orders.apk }
      - name: Publish download link (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Saeedi Orders – latest Android app
          body: Download Saeedi-Orders.apk below and install it on your Android phone.
          files: Saeedi-Orders.apk
          make_latest: true
